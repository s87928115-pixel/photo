<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曼谷地鐵地圖集</title>
    <style>
        body {
            background-color: #faf8f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #4a4a4a;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
            letter-spacing: 2px;
        }
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .image-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 900px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .image-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            cursor: zoom-in;
            border: 1px solid #eee;
        }
        .image-title {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(250, 248, 245, 0.95);
            align-items: center;
            justify-content: center;
            overflow: auto;
            cursor: zoom-out;
        }
        #lightbox img {
            max-width: 95%;
            max-height: 95vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        #close-btn {
            position: fixed;
            top: 20px;
            right: 40px;
            font-size: 50px;
            cursor: pointer;
            color: #333;
            font-weight: bold;
            transition: color 0.2s;
        }
        #close-btn:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

<h1>🚇 曼谷地鐵旅遊地圖集</h1>

<div class="gallery">
    <!-- 第一張圖 (對應 map1.png) -->
    <div class="image-card">
        <img src="map1.png" alt="2025 曼谷地鐵 完整版" onclick="openLightbox(this.src)">
        <div class="image-title">2025 曼谷地鐵 完整版</div>
    </div>
    
    <!-- 第二張圖 (對應 map2.png) -->
    <div class="image-card">
        <img src="map2.png" alt="2025 曼谷地鐵 完整版 (附帶全線沿線景點)" onclick="openLightbox(this.src)">
        <div class="image-title">2025 曼谷地鐵 完整版 (附帶全線沿線景點)</div>
    </div>
    
    <!-- 第三張圖 (對應 map3.png) -->
    <div class="image-card">
        <img src="map3.png" alt="2026 曼谷地鐵 (+建置中最新路線)" onclick="openLightbox(this.src)">
        <div class="image-title">2026 曼谷地鐵 (+建置中最新路線)</div>
    </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <span id="close-btn">&times;</span>
    <img id="lightbox-img" src="">
</div>

<script>
    function openLightbox(src) {
        document.getElementById('lightbox').style.display = 'flex';
        document.getElementById('lightbox-img').src = src;
    }
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
</script>

</body>
</html>
